name: security-release

on:
  pull_request:
  push:
    branches: [develop, main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-bookworm@sha256:da788743d2060767375896de4d646f7576f5911461444b372616f19ea61db2ec
        env:
          POSTGRES_USER: daski
          POSTGRES_PASSWORD: daski
          POSTGRES_DB: daski_provider_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U daski -d daski_provider_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL_TEST: postgresql://daski:daski@127.0.0.1:5432/daski_provider_smoke
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run security:audit
      - run: npm run typecheck
      - run: npm run typecheck:test
      - run: npm run lint
      - run: npm run lint:architecture
      - run: npm run docs:check
      - run: npm run skill:validate
      - run: docker compose config --quiet
      - run: npm run test:coverage
      - run: npm run test:critical-coverage
      - run: npm run test:mainnet-readiness
      - run: npm run security:migration-smoke
      - run: npm run build
      - run: npm run security:pii-scan -- dist
      - name: Secret scan
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          detect --source=/repo --no-git --redact
          --config=/repo/.gitleaks.toml --exit-code=1
      - name: Build production image
        run: docker build -t daski-provider:ci .
      - name: Verify production image boundary
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' daski-provider:ci)" = "node"
          docker run --rm --entrypoint sh daski-provider:ci -c \
            'test ! -e /app/test && test ! -e /app/docs && test ! -e /app/scripts && test ! -e /app/.env'

  windows-tooling:
    name: Windows tooling
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run docs:check
      - run: npm run skill:validate
      - name: Verify CRLF skill validation
        shell: pwsh
        run: |
          $paths = Get-ChildItem ".agents/skills/daski-provider" -Recurse -File -Filter "*.md"
          $original = @{}
          foreach ($path in $paths) {
            $original[$path.FullName] = [IO.File]::ReadAllBytes($path.FullName)
          }
          try {
            foreach ($path in $paths) {
              $text = [Text.Encoding]::UTF8.GetString($original[$path.FullName])
              $text = $text.Replace("`r`n", "`n").Replace("`r", "`n")
              [IO.File]::WriteAllText(
                $path.FullName,
                $text.Replace("`n", "`r`n"),
                [Text.UTF8Encoding]::new($false)
              )
            }
            npm run skill:validate
            if ($LASTEXITCODE -ne 0) { throw "CRLF validation failed" }
          } finally {
            foreach ($path in $paths) {
              [IO.File]::WriteAllBytes($path.FullName, $original[$path.FullName])
            }
          }
      - run: npm run test:run -- test/doctor.test.ts test/toolingContract.test.ts

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, windows-tooling]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Verify tag and versions
        run: >-
          node -e 'const fs=require("node:fs");
          const expected=process.env.GITHUB_REF_NAME.slice(1);
          const actual=require("./package.json").version;
          const source=fs.readFileSync(".agents/skills/daski-provider/SKILL.md","utf8");
          const skill=/^  version: "([^"]+)"$/m.exec(source)?.[1];
          if(actual!==expected||skill!==expected){throw new Error(
          `tag ${expected} does not match package ${actual} and skill ${skill}`)}'
      - name: Build release archives
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="provider-${VERSION}/" \
            --output="provider-${VERSION}.tar.gz" HEAD
          git archive --format=zip --prefix=daski-provider/ \
            --output=daski-provider-agent-skill.zip \
            HEAD:.agents/skills/daski-provider
          sha256sum "provider-${VERSION}.tar.gz" \
            daski-provider-agent-skill.zip > SHA256SUMS
      - name: Inspect release package and checksums
        shell: bash
        run: |
          expected=(
            "daski-provider/"
            "daski-provider/SKILL.md"
            "daski-provider/references/"
            "daski-provider/references/daski-primer.md"
            "daski-provider/references/integration-brief.md"
            "daski-provider/references/onboarding-handoff.md"
            "daski-provider/references/provider-full.md"
            "daski-provider/references/start-here.md"
          )
          diff -u \
            <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort) \
            <(unzip -Z1 daski-provider-agent-skill.zip | LC_ALL=C sort)
          sha256sum --check SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          prerelease=()
          if [[ "$VERSION" == 0.* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --generate-notes "${prerelease[@]}" \
            provider-*.tar.gz daski-provider-agent-skill.zip SHA256SUMS
